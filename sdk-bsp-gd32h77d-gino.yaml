  chip_name: GD32H77DIW
  clock_source: HXTAL
  device_vendor: GigaDevice
  family_name: GD32
  rx_name: PA3
  series_name: GD32H7
  source_freq: '25000000'
  sub_series_name: GD32H77x_78x
  target_freq: '600000000'
