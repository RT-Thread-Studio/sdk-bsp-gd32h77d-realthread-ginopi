docs: []
features:
- Arm Cortex-M7 up to 600 MHz
- MIPI DSI LCD and GT911 capacitive touch
- OV7670 camera preview
- 32 MiB external SDRAM and 8 MiB QSPI flash
- RMII Ethernet, SD card, USB device/host and CAN
- GD32VW553 AT Wi-Fi and MQTT
features_zh:
- Arm Cortex-M7，最高主频 600 MHz
- MIPI DSI LCD 与 GT911 电容触摸
- OV7670 摄像头预览
- 32 MiB 外部 SDRAM 与 8 MiB QSPI Flash
- RMII 以太网、SD 卡、USB Device/Host 与 CAN
- GD32VW553 AT Wi-Fi 与 MQTT
